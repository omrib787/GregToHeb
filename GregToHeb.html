<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ממיר תאריך עברי</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>מה התאריך העברי?</h1>
    <p class="subtitle">בחרו תאריך לועזי וגלו את התאריך העברי שלו</p>

    <input type="date" id="dateInput">
    <label>
      <input type="checkbox" id="afterSunset">
      אחרי השקיעה
    </label>
    <button id="convertBtn">המר</button>

    <section id="result"></section>
  </main>

  <script>
        // 1. Find the elements on the page
    const dateInput = document.getElementById('dateInput');
    const afterSunset = document.getElementById('afterSunset');
    const convertBtn = document.getElementById('convertBtn');
    const result = document.getElementById('result');

    // 2. When the button is clicked, run convert()
    convertBtn.addEventListener('click', convert);

    // 3. The main function
    async function convert() {
      const date = dateInput.value; // e.g. "2026-11-22"

      if (!date) {
        result.textContent = 'נא לבחור תאריך';
        return;
      }

      result.textContent = 'טוען...';

      try {
        let url = `https://www.hebcal.com/converter?cfg=json&date=${date}&g2h=1&lg=he`;
        if (afterSunset.checked) {
          url += '&gs=on';
        }        const response = await fetch(url);

        if (!response.ok) {
          throw new Error('שגיאת שרת: ' + response.status);
        }

        const data = await response.json();
                showResult(data);
      } catch (error) {
        result.textContent = 'משהו השתבש: ' + error.message;
      }
    }
     function showResult(data) {
      result.textContent = ''; // clear the previous result

      const hebrewDate = document.createElement('h2');
      hebrewDate.textContent = data.hebrew + (data.afterSunset ? ' (אחרי השקיעה)' : '');
      result.appendChild(hebrewDate);

      if (data.events && data.events.length > 0) {
        const title = document.createElement('p');
        title.textContent = 'מה קורה בתאריך הזה:';
        result.appendChild(title);

        const list = document.createElement('ul');
        for (const event of data.events) {
          const item = document.createElement('li');
          item.textContent = event;
          list.appendChild(item);
        }
        result.appendChild(list);
      }
    }
  </script>
</body>
</html>
